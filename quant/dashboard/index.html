<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>崩盤類比儀表板 · Crash Analog Dashboard</title>
<style>
:root{
  --background:#ffffff; --foreground:#1a1d1f;
  --card:#f6f7f8; --card-foreground:#1a1d1f;
  --muted:#eceff0; --muted-foreground:#5d666a;
  --border:#d6dde1; --popover:#ffffff; --popover-foreground:#1a1d1f;
  --destructive:#c2334a;
  --viz-series-1:#578095; --viz-series-2:#a22c40; --viz-series-3:#4d7f4e;
  --viz-series-4:#8a6d3b; --viz-series-5:#7a5296; --viz-series-6:#3d7a8c;
}
*{box-sizing:border-box}
body{margin:0 auto;padding:20px;max-width:1100px;background:var(--background);color:var(--foreground);
     font-family:"Microsoft JhengHei","PingFang TC",sans-serif;font-size:14px;line-height:1.5}
h1{font-size:20px;font-weight:500;margin:0 0 4px}
h3{font-size:16px;font-weight:500;margin:14px 0 8px}
.muted{color:var(--muted-foreground);font-size:12px;margin:0 0 14px}
.card{background:var(--card);color:var(--card-foreground);border-radius:10px;padding:12px 14px}
.viz-stat{display:flex;flex-direction:column;gap:3px}
.viz-stat-value{font-size:26px;font-weight:500;line-height:1.2}
.viz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.viz-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.nav.nav-pills{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.nav-link{border:1px solid var(--border);background:var(--card);color:var(--foreground);
          border-radius:999px;padding:5px 14px;font:inherit;cursor:pointer}
.nav-link.active,.nav-link[aria-selected="true"]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.text-small{font-size:12px}
.text-muted{color:var(--muted-foreground)}
.tabular-nums{font-variant-numeric:tabular-nums}
.tooltip{position:absolute;z-index:10;pointer-events:none;background:var(--popover);color:var(--popover-foreground);
         border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:230px}
.table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
.table th{text-align:left;font-weight:500;border-bottom:1px solid var(--border);padding:5px 7px;color:var(--muted-foreground)}
.table td{border-bottom:1px solid var(--border);padding:5px 7px;vertical-align:top}
.text-nowrap{white-space:nowrap}
footer{margin-top:18px;color:var(--muted-foreground);font-size:12px}
</style>
</head><body>
<h1 data-i18n="doc_h1">崩盤類比儀表板</h1>
<p class="muted" data-i18n="doc_subtitle">2026 年 AI 行情 vs 1929/1973/1987/2000/2007/2021 · 資料截至 2026-11-06 · 作者 Charlie Chu · 數字可由 quant/ 管線重現</p>
<style>
.cad-langbar{display:flex;justify-content:flex-end;gap:6px;margin:0 0 10px}
.cad-langbar .nav-link{padding:3px 10px;font-size:12px}
.cad-intro{margin-bottom:14px;font-size:13.5px}
.cad-intro p{margin:6px 0}
.cad-guide{border:1px solid var(--border);background:var(--card);border-radius:10px;margin:0 0 10px;font-size:13px}
.cad-guide summary{cursor:pointer;padding:9px 12px;font-weight:500;user-select:none;list-style:none}
.cad-guide summary::-webkit-details-marker{display:none}
.cad-guide summary::before{content:"▾ ";color:var(--muted-foreground)}
.cad-guide:not([open]) summary::before{content:"▸ "}
.cad-guide-body{padding:0 12px 10px;color:var(--foreground)}
.cad-guide-body p{margin:7px 0}
.cad-guide-body ul{margin:6px 0;padding-left:20px}
.cad-tldr{background:var(--muted);border-radius:8px;padding:7px 9px}
.cad-info{cursor:help;color:var(--muted-foreground);font-size:12px;border-bottom:1px dotted var(--border);margin-left:4px}
.cad-gloss-group td{font-weight:500;background:var(--muted);color:var(--foreground)}
</style>
<div id="crash-analog-dashboard">

  <div class="cad-langbar" role="group" aria-label="Language / 語言 / 语言">
    <button type="button" class="nav-link cad-lang" data-lang="hant">繁體中文</button>
    <button type="button" class="nav-link cad-lang" data-lang="hans">简体中文</button>
    <button type="button" class="nav-link cad-lang" data-lang="en">English</button>
  </div>

  <div class="card cad-intro">
    <p data-i18n="intro_p1"></p>
    <p data-i18n="intro_p2"></p>
  </div>

  <div class="viz-grid" id="cad-stats">
    <div class="card viz-stat"><span class="text-muted"><span data-i18n="kpi1_label"></span><span class="cad-info" data-i18n-tip="kpi1_tip">ⓘ</span></span><span class="viz-stat-value tabular-nums" id="cad-v-cape">40.71</span><span class="text-muted" id="cad-c-cape"></span></div>
    <div class="card viz-stat"><span class="text-muted"><span data-i18n="kpi2_label"></span><span class="cad-info" data-i18n-tip="kpi2_tip">ⓘ</span></span><span class="viz-stat-value tabular-nums" id="cad-v-mvgdp">2.55</span><span class="text-muted" data-i18n="kpi2_cap"></span></div>
    <div class="card viz-stat"><span class="text-muted"><span data-i18n="kpi3_label"></span><span class="cad-info" data-i18n-tip="kpi3_tip">ⓘ</span></span><span class="viz-stat-value tabular-nums" id="cad-v-ecy">−2.78%</span><span class="text-muted" data-i18n="kpi3_cap"></span></div>
    <div class="card viz-stat"><span class="text-muted"><span data-i18n="kpi4_label"></span><span class="cad-info" id="cad-info-dd">ⓘ</span></span><span class="viz-stat-value tabular-nums" id="cad-v-dd">NDX −13.6%</span><span class="text-muted" id="cad-s-dd">TAIEX −20.3% · NVDA −22.0% · SPX −5.7%</span></div>
  </div>

  <div class="nav nav-pills" role="tablist" aria-label="儀表板面板">
    <button class="nav-link active" id="cad-tab-paths" role="tab" aria-controls="cad-panel-paths" aria-selected="true" type="button" data-i18n="tab_paths"></button>
    <button class="nav-link" id="cad-tab-cond" role="tab" aria-controls="cad-panel-cond" aria-selected="false" type="button" data-i18n="tab_cond"></button>
    <button class="nav-link" id="cad-tab-lppl" role="tab" aria-controls="cad-panel-lppl" aria-selected="false" type="button" data-i18n="tab_lppl"></button>
    <button class="nav-link" id="cad-tab-scen" role="tab" aria-controls="cad-panel-scen" aria-selected="false" type="button" data-i18n="tab_scen"></button>
    <button class="nav-link" id="cad-tab-gloss" role="tab" aria-controls="cad-panel-gloss" aria-selected="false" type="button" data-i18n="tab_gloss"></button>
  </div>

  <div id="cad-panel-paths" role="tabpanel" aria-labelledby="cad-tab-paths">
    <h3 data-i18n="paths_h3"></h3>
    <details class="cad-guide" open>
      <summary data-i18n="guide_how"></summary>
      <div class="cad-guide-body">
        <p data-i18n="guide1_read"></p>
        <p data-i18n="guide1_now"></p>
        <p class="cad-tldr" data-i18n="guide1_tldr"></p>
      </div>
    </details>
    <div class="viz-row" id="cad-path-legend" role="group" aria-label="切換顯示的崩盤案例"></div>
    <div id="cad-paths-wrap" style="position:relative;">
      <svg id="cad-paths-svg" role="img" aria-label="歷史崩盤後的回檔路徑折線圖，按距峰頂月數對齊"></svg>
      <div class="tooltip" role="tooltip" hidden></div>
    </div>
    <p class="text-small text-muted" data-i18n="paths_cap"></p>
  </div>

  <div id="cad-panel-cond" role="tabpanel" aria-labelledby="cad-tab-cond" hidden>
    <h3 data-i18n="cond_h3"></h3>
    <details class="cad-guide" open>
      <summary data-i18n="guide_how"></summary>
      <div class="cad-guide-body">
        <p data-i18n="guide2_read"></p>
        <p data-i18n="guide2_now"></p>
        <p class="cad-tldr" data-i18n="guide2_tldr"></p>
      </div>
    </details>
    <div id="cad-cond-wrap"></div>
    <p class="text-small text-muted" data-i18n="cond_cap"></p>
  </div>

  <div id="cad-panel-lppl" role="tabpanel" aria-labelledby="cad-tab-lppl" hidden>
    <h3 data-i18n="lppl_h3"></h3>
    <details class="cad-guide" open>
      <summary data-i18n="guide_how"></summary>
      <div class="cad-guide-body">
        <p data-i18n="guide3_read"></p>
        <p data-i18n="guide3_honest"></p>
        <p class="cad-tldr" data-i18n="guide3_tldr"></p>
      </div>
    </details>
    <div id="cad-lppl-wrap"></div>
    <h3 data-i18n="lppl_val_h3"></h3>
    <div id="cad-lppl-val"></div>
    <p class="text-small text-muted" data-i18n="lppl_cap"></p>
  </div>

  <div id="cad-panel-scen" role="tabpanel" aria-labelledby="cad-tab-scen" hidden>
    <h3 data-i18n="scen_h3"></h3>
    <details class="cad-guide" open>
      <summary data-i18n="guide_how"></summary>
      <div class="cad-guide-body">
        <p data-i18n="guide4_read"></p>
        <p data-i18n="guide4_concl"></p>
        <p class="cad-tldr" data-i18n="guide4_tldr"></p>
      </div>
    </details>
    <div id="cad-scen-wrap"></div>
    <div id="cad-scen-table"></div>
    <p class="text-small text-muted" data-i18n="scen_timing_cap"></p>
  </div>

      guide_how: "这张图怎么看？",
      guide1_read: "<b>怎么读：</b>每条线是一场崩盘“从最高点算起”的走势——往右＝距峰顶过了几个月，往下＝跌得越深。粗彩色线是 2026 进行中的三个标的，灰色虚线是历史案例（点上方标签可开关）。鼠标移到图上会出现直线，同时列出所有案例“在那个月份”各跌到多深。",
      guide1_now: "<b>现在的位置：</b>这波截至 2026-11-06 才走到“第 1 个月”附近（NDX 约 −14%）。目前跌幅在历史上并不稀奇——真正分歧的是“接下来”：有的案例几个月内收复（如 1987、2021），有的持续下跌 2–3 年（如 2000、1973）。",
      guide1_tldr: "<b>一句话重点：</b>现在的跌幅本身不稀奇，稀奇的是估值等级（见上方数字卡）。历史剧本走到这里之后分歧极大——所以才需要后面几页的统计，而不是只看这张图讲故事。",
      guide2_read: "<b>怎么读：</b>这页回答一个很直觉的问题——“历史上跌到某个深度之后，<b>最后</b>到底跌到多深才见底？”三张小图各是一个标的：X 轴＝当时已跌到的深度，Y 轴＝最终谷底（自峰顶起算）。实线＝<b>中位数</b>（一半的经验比这浅、一半比这深），紫虚线＝<b>最惨 10%</b> 的情况（p10 深尾），红虚线＝现在的位置。鼠标移到圆点上可读数字。",
      guide2_now: "<b>现在的位置：</b>NDX 跌约 14%：历史上跌到 −15% 左右时，最终谷底中位数约 −23%（通常还会再深一点）、最惨 10% 约 −38%。TAIEX 跌约 20% → 中位数约 −30%、深尾约 −56%。NVDA 跌约 22% → 中位数约 −37%、深尾约 −75%（个股波动远大于指数）。",
      guide2_tldr: "<b>一句话重点：</b>越早止跌、结局越温和；但“跌 15–20% 还没止跌”时，历史经验显示进一步下探的空间会变大。这是分布、不是保证——同类回调之后 1 年，中位数报酬仍是正的（NDX +31.2%）。",
      guide3_read: "<b>怎么读：</b>LPPL 是侦测“泡沫临界”的数学模型——当涨势出现“越涨越快”的加速形态，模型会估出一个临界时点 <b>tc</b>（转折最可能发生的时间）。我们用“滚动窗口”每个月重复拟合一次，把每次估出的 tc 画成长条：<b>长条越集中的月份，代表越多个窗口指向那里</b>。信心＝通过筛选的拟合中，tc 落在窗口结束后 6 个月内的比例。",
      guide3_honest: "<b>诚实声明：</b>NDX 与 NVDA 的 tc 丛集（2026-10～12）是在峰顶<b>已经发生后</b>才拟合出来的，属事后验证性质；真正“往前看”的只有 TAIEX（估 2027-01 前后）。下方验证表示范 1999 年 NDX：模型约领先 3–6 个月逐渐逼近真实峰顶（2000-03-27），误差带 ±3–6 个月。",
      guide3_tldr: "<b>一句话重点：</b>LPPL 只回答“何时可能转折”，不回答“会跌多深”。它的角色是辅助时点判断，不是精确预言。",
      guide4_read: "<b>怎么读：</b>这页把前面所有证据整合成四个互斥的“剧本”，概率合计 100%：E1 不再加深（回调不破 −15%）、E2 浅修正 −15~−25%、E3 深度修正 −25~−40%、E4 终结性崩盘 ≤−40%。E1 的精确定义＝未来 24 个月自峰顶起算的最大回调<b>从未深过 −15%</b>——先涨上去之后若再回调，只要不破 −15% 仍属 E1；一旦跌破就归 E2–E4。每条横条中间的深色刻度＝<b>点概率</b>（单一最佳估计），浅色长条＝<b>80% 区间</b>（把模型自身的不确定性算进去后，概率有八成落在这个范围）。鼠标移上可读数字。",
      guide4_concl: "<b>现在的结论：</b>以 NDX 而言，最可能是 E2 浅修正（约 50%），但 E3＋E4 合计约 48%——“浅修正收场”与“还有更深一段”几乎五五波。时间上：约 50% 的概率本轮终点出现在 2026Q4、累计到 2027H1 约 80–85%。台股类比的经验更严峻：终点 ≤−25% 的概率约 97%。",

      guide1_read: "<b>How to read:</b> each line is one crash episode anchored at its peak — rightward = months since the peak; downward = deeper. Thick colored lines are the three live 2026 series; grey dashed lines are historical episodes (click the tags above to toggle). Hovering shows a line listing every visible episode’s depth at that month.",

    if (l === "zh-tw" || l === "zh-hk" || l === "zh-mo" || l.startsWith("zh-hant")) return "hant";
    if (l === "zh-cn" || l === "zh-sg" || l.startsWith("zh-hans")) return "hans";
    if (l.startsWith("en")) return "en";
    return "hant";
  };
  let LANG = (() => {
    try {
      const s = localStorage.getItem("cad-lang");
      if (s && LANGS.includes(s)) return s;
    } catch (e) {}
    return detectLang();
  })();
  const t = (k) => (I18N[LANG] && I18N[LANG][k] != null) ? I18N[LANG][k] : I18N.hant[k];
  const tf = (k, vars) => t(k).replace(/\{(\w+)\}/g, (m, name) => (vars && vars[name] != null) ? vars[name] : m);

  const applyLang = () => {
    document.documentElement.lang = LANG === "hant" ? "zh-Hant" : LANG === "hans" ? "zh-Hans" : "en";
    document.title = t("doc_title");
    const h1 = document.querySelector("h1");
    if (h1) h1.innerHTML = t("doc_h1");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-tip]").forEach(el => { el.setAttribute("data-tooltip", t(el.getAttribute("data-i18n-tip"))); });
    ROOT.querySelectorAll(".cad-lang").forEach(b => b.classList.toggle("active", b.dataset.lang === LANG));
  };
  const setLang = (l) => {
    if (!LANGS.includes(l)) return;
    LANG = l;
    try { localStorage.setItem("cad-lang", l); } catch (e) {}
    applyLang();
    buildLegend();
    fillKPI();
    drawPaths();
    drawCond();
    drawLppl();
    drawScen();
  };

  const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888";
  let PAL = {};
  const refreshPalette = () => {
    PAL = {
      s: [1, 2, 3, 4, 5, 6].map(i => cssVar("--viz-series-" + i)),
      fg: cssVar("--foreground"), mut: cssVar("--muted-foreground"),
      border: cssVar("--border"), pop: cssVar("--popover"), popFg: cssVar("--popover-foreground"),
      red: cssVar("--destructive"),
    };
  };
  refreshPalette();

  const PATH_META = [
    { ep: "NDX 2026 (live)", k: "ndx2026", live: true },
    { ep: "TAIEX 2026 (live)", k: "taiex2026", live: true },
    { ep: "NVDA 2026 (live)", k: "nvda2026", live: true },
    { ep: "NDX 2000", k: "ndx2000" },
    { ep: "SPX 2000", k: "spx2000" },
    { ep: "TAIEX 2000", k: "taiex2000" },
    { ep: "CSCO 2000 (stock)", k: "csco2000" },
    { ep: "Nikkei 1989", k: "nikkei1989" },
    { ep: "SPX 1929 (monthly)", k: "spx1929" },
    { ep: "SPX 1973", k: "spx1973" },
    { ep: "SPX 1987", k: "spx1987" },
    { ep: "SPX 2007", k: "spx2007" },
    { ep: "NDX 2021", k: "ndx2021" },
  ];
  const HOR = 60; // months shown
  const visible = new Set(PATH_META.map(d => d.ep));

  // ────────────────────────────── panel 1: aligned paths
  const svgPaths = d3.select("#cad-paths-svg");
  const pathsWrap = document.getElementById("cad-paths-wrap");
  const tooltip = pathsWrap.querySelector(".tooltip");

  function drawPaths() {
    const W = Math.max(pathsWrap.clientWidth, 320), H = Math.max(320, Math.min(430, W * 0.5));
    const M = { t: 14, r: 14, b: 46, l: 46 };
    svgPaths.attr("viewBox", `0 0 ${W} ${H}`).attr("width", W).attr("height", H);
    svgPaths.selectAll("*").remove();
    const x = d3.scaleLinear().domain([0, HOR]).range([M.l, W - M.r]);
    const ys = [];
    PATH_META.forEach(m => (DATA.paths[m.ep] || []).forEach(p => { if (p[0] <= HOR) ys.push(p[1]); }));
    const y = d3.scaleLinear().domain([d3.min(ys) - 3, 4]).range([H - M.b, M.t]);
    const g = svgPaths.append("g");
    // frame + grid
    g.append("rect").attr("data-chart-frame", "").attr("x", M.l).attr("y", M.t)
      .attr("width", W - M.l - M.r).attr("height", H - M.t - M.b)
      .attr("fill", "none").attr("stroke", PAL.border).attr("stroke-width", 1);
    const yTicks = H < 360 ? [-30, -60, -90] : [-10, -30, -50, -70, -90];
    yTicks.forEach(v => {
      g.append("line").attr("x1", M.l).attr("x2", W - M.r).attr("y1", y(v)).attr("y2", y(v))
        .attr("stroke", PAL.border).attr("stroke-width", 0.6).attr("stroke-dasharray", "2 3");
      g.append("text").attr("x", M.l - 6).attr("y", y(v)).attr("dy", "0.32em").attr("text-anchor", "end")
        .attr("font-size", 11).attr("fill", PAL.mut).text(v + "%");
    });
    const xTicks = W < 420 ? [0, 12, 24, 36, 48] : [0, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60];
    xTicks.forEach(v => {
      g.append("text").attr("x", x(v)).attr("y", H - M.b + 16).attr("text-anchor", "middle")
        .attr("font-size", 11).attr("fill", PAL.mut).text(v + t("axis_tick_x"));
    });
    g.append("text").attr("class", "axis-title").attr("data-axis", "x").attr("x", W - M.r)
      .attr("y", H - M.b + 31).attr("text-anchor", "end").attr("font-size", 11).attr("fill", PAL.fg).text(t("axis_x"));
    g.append("text").attr("class", "axis-title").attr("data-axis", "y").attr("x", M.l)
      .attr("y", M.t - 4).attr("text-anchor", "start").attr("font-size", 11).attr("fill", PAL.fg).text(t("axis_y"));
    const line = d3.line().x(d => x(d[0])).y(d => y(d[1]));
    const clipId = "cad-paths-clip";
    const defs = svgPaths.append("defs");
    defs.append("clipPath").attr("id", clipId)
      .append("rect").attr("x", M.l).attr("y", M.t)
      .attr("width", W - M.l - M.r).attr("height", H - M.t - M.b);
    const gSeries = g.append("g").attr("clip-path", `url(#${clipId})`);
    const idx = new Map(); // ep -> points (for hover)
    PATH_META.forEach((m, i) => {
      if (!visible.has(m.ep)) return;
      // the analog story ends at recovery: cut the path at its first non-negative month
      const all = (DATA.paths[m.ep] || []).filter(p => p[0] <= HOR);
      const cut = all.findIndex(p => p[1] >= 0);
      const pts = cut >= 0 ? all.slice(0, cut + 1) : all;
      idx.set(m.ep, pts);
      const col = m.live ? PAL.s[i % 3] : PAL.mut;
      gSeries.append("path").attr("d", line(pts)).attr("fill", "none").attr("stroke", col)
        .attr("stroke-width", m.live ? 2.6 : 1.2).attr("stroke-opacity", m.live ? 1 : 0.75)
        .attr("stroke-dasharray", m.live ? null : "3 2");
    });
    // cross-series hover overlay
    const ov = g.append("rect").attr("data-chart-hit", "").attr("data-chart-hover-overlay", "cross-series")
      .attr("x", M.l).attr("y", M.t).attr("width", W - M.l - M.r).attr("height", H - M.t - M.b)
      .attr("fill", "transparent");
    const guide = g.append("line").attr("data-chart-hover-guide", "").attr("y1", M.t).attr("y2", H - M.b)
      .attr("stroke", PAL.border).attr("stroke-width", 1).style("display", "none");
    const bis = d3.bisector(d => d[0]).center;
    ov.on("pointermove", (ev) => {
      const [mx] = d3.pointer(ev, g.node());
      const xv = Math.max(0, Math.min(HOR, Math.round(x.invert(mx))));
      guide.attr("x1", x(xv)).attr("x2", x(xv)).style("display", null);
      const rows = [];
      PATH_META.forEach(m => {
        if (!visible.has(m.ep)) return;
        const pts = idx.get(m.ep);
        if (!pts || !pts.length) return;
        const i = Math.min(bis(pts, xv), pts.length - 1);
        rows.push({ label: t("path_" + m.k), v: pts[i][1], live: m.live });
      });
      rows.sort((a, b) => a.v - b.v);
      svgPaths.selectAll("circle[data-chart-hover-marker]").remove();
      rows.forEach(r => {
        const col = r.live ? PAL.s[0] : PAL.mut;
        g.append("circle").attr("data-chart-hover-marker", "").attr("cx", x(xv))
          .attr("cy", y(r.v)).attr("r", 3).attr("fill", col);
      });
      tooltip.hidden = false;
      tooltip.innerHTML = `<b>${tf("tt_month", { n: xv })}</b><br>` + rows.map(r =>
        `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${r.live ? PAL.s[0] : PAL.mut};margin-right:5px;"></span>${tf("tt_p1_row", { l: r.label, v: r.v.toFixed(1) })}`).join("<br>");
      const rect = pathsWrap.getBoundingClientRect();
      let tx = ev.clientX - rect.left + 14, ty = ev.clientY - rect.top + 14;
      if (tx + 190 > rect.width) tx -= 210;
      tooltip.style.left = tx + "px"; tooltip.style.top = ty + "px";
    });
    ov.on("pointerleave", () => {
      guide.style("display", "none");
      svgPaths.selectAll("circle[data-chart-hover-marker]").remove();
      tooltip.hidden = true;
    });
  }

  // legend toggle buttons (rebuilt on language switch)
  function buildLegend() {
    const legend = document.getElementById("cad-path-legend");
    legend.innerHTML = "";
    PATH_META.forEach((m, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("aria-pressed", "true");
      b.style.cssText = "background:none;border:none;cursor:pointer;padding:2px 6px;font:inherit;color:var(--foreground);display:inline-flex;align-items:center;gap:5px;";
      const sw = document.createElement("span");
      sw.style.cssText = `width:10px;height:10px;border-radius:2px;background:${m.live ? "var(--viz-series-" + (i % 3 + 1) + ")" : "var(--muted-foreground)"};opacity:${m.live ? 1 : 0.6};`;
      b.appendChild(sw);
      b.appendChild(document.createTextNode(t("path_" + m.k)));
      if (m.live) b.style.fontWeight = "500";
      b.addEventListener("click", () => {
        if (visible.has(m.ep) && visible.size > 1) { visible.delete(m.ep); b.setAttribute("aria-pressed", "false"); sw.style.opacity = 0.25; }
        else { visible.add(m.ep); b.setAttribute("aria-pressed", "true"); sw.style.opacity = m.live ? 1 : 0.6; }
        drawPaths();
      });
      legend.appendChild(b);
    });
  }

  // ────────────────────────────── panel 2: conditional small multiples
  function drawCond() {
    const wrap = document.getElementById("cad-cond-wrap");
    wrap.innerHTML = "";
    const assets = [
      { key: "NDX", label: t("cond_ndx"), cur: 14.7 },
      { key: "TAIEX", label: t("cond_taiex"), cur: 20.3 },
      { key: "NVDA", label: t("cond_nvda"), cur: 24.1 },
    ];
    const cur = { NDX: (DATA.live.NDX || {}).drawdown_pct, TAIEX: (DATA.live.TAIEX || {}).drawdown_pct, NVDA: (DATA.live.NVDA || {}).drawdown_pct };
    assets.forEach(a => {
      a.cur = Math.abs(cur[a.key] != null ? cur[a.key] : a.cur);
      const W = Math.max(wrap.clientWidth || 600, 320), H = 200, M = { t: 26, r: 54, b: 30, l: 46 };
      const div = document.createElement("div");
      div.style.cssText = "position:relative;";
      wrap.appendChild(div);
      const svg = d3.select(div).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", W).attr("height", H)
        .attr("role", "img").attr("aria-label", a.label + "：觸及深度對終點深度");
      const ptsM = [], ptsP = [];
      Object.entries((DATA.conditional[a.key] || {})).forEach(([d, s]) => {
        ptsM.push([+d, s.median_eventual_max_dd]); ptsP.push([+d, s.p10_eventual_max_dd]);
      });
      const x = d3.scaleLinear().domain([8, 32]).range([M.l, W - M.r]);
      const y = d3.scaleLinear().domain([d3.min(ptsP.map(p => p[1])) - 5, -8]).range([H - M.b, M.t]);
      svg.append("rect").attr("data-chart-frame", "").attr("x", M.l).attr("y", M.t)
        .attr("width", W - M.l - M.r).attr("height", H - M.t - M.b)
        .attr("fill", "none").attr("stroke", PAL.border).attr("stroke-width", 1);
      [-20, -30, -40, -50, -60, -70, -80].forEach(v => {
        if (y(v) < M.t || y(v) > H - M.b) return;
        svg.append("line").attr("x1", M.l).attr("x2", W - M.r).attr("y1", y(v)).attr("y2", y(v))
          .attr("stroke", PAL.border).attr("stroke-width", 0.6).attr("stroke-dasharray", "2 3");
        svg.append("text").attr("x", M.l - 5).attr("y", y(v)).attr("dy", "0.32em").attr("text-anchor", "end")
          .attr("font-size", 11).attr("fill", PAL.mut).text(v + "%");
      });
      (W < 420 ? [10, 20, 30] : [10, 15, 20, 25, 30]).forEach(v => {
        svg.append("text").attr("x", x(v)).attr("y", H - M.b + 16).attr("text-anchor", "middle")
          .attr("font-size", 11).attr("fill", PAL.mut).text("−" + v + "%");
      });
      svg.append("text").attr("x", M.l).attr("y", 12).attr("font-size", 11).attr("fill", PAL.fg)
        .text(a.label);
      svg.append("text").attr("class", "axis-title").attr("data-axis", "x").attr("x", W - M.r)
        .attr("y", H - M.b + 29).attr("text-anchor", "end").attr("font-size", 11).attr("fill", PAL.fg).text(t("cond_axis_x"));
      const line = d3.line().x(d => x(d[0])).y(d => y(d[1]));
      const addSeries = (pts, col, dash, name) => {
        svg.append("path").attr("d", line(pts)).attr("fill", "none").attr("stroke", col)
          .attr("stroke-width", 2).attr("stroke-dasharray", dash);
        pts.forEach(p => {
          svg.append("circle").attr("cx", x(p[0])).attr("cy", y(p[1])).attr("r", 3.2).attr("fill", col)
            .attr("data-tooltip", tf("tt_cond", { s: name, d: p[0], v: p[1].toFixed(1) }));
        });
      };
      addSeries(ptsP, PAL.s[5], "4 3", t("cond_s_tail"));
      addSeries(ptsM, PAL.s[0], null, t("cond_s_med"));
      // current depth marker
      svg.append("line").attr("x1", x(a.cur)).attr("x2", x(a.cur)).attr("y1", M.t).attr("y2", H - M.b)
        .attr("stroke", PAL.red).attr("stroke-width", 1.2).attr("stroke-dasharray", "3 3");
      svg.append("text").attr("x", x(a.cur) + 4).attr("y", M.t + 12).attr("font-size", 11).attr("fill", PAL.red)
        .text(tf("cond_now", { v: a.cur.toFixed(1) }));
    });
    // single shared legend
    const lg = document.createElement("div");
    lg.className = "viz-row";
    lg.innerHTML = `<button type="button" aria-pressed="true" style="background:none;border:none;cursor:pointer;font:inherit;color:var(--foreground);display:inline-flex;align-items:center;gap:5px;"><span style="width:12px;height:3px;background:var(--viz-series-1);"></span>${t("cond_leg_med")}</button>
      <button type="button" aria-pressed="true" style="background:none;border:none;cursor:pointer;font:inherit;color:var(--foreground);display:inline-flex;align-items:center;gap:5px;"><span style="width:12px;height:3px;background:var(--viz-series-6);"></span>${t("cond_leg_tail")}</button>
      <button type="button" aria-pressed="true" style="background:none;border:none;cursor:pointer;font:inherit;color:var(--foreground);display:inline-flex;align-items:center;gap:5px;"><span style="width:12px;height:0;border-top:2px dashed var(--destructive);"></span>${t("cond_leg_now")}</button>`;
    wrap.appendChild(lg);
  }

  // ────────────────────────────── panel 3: LPPL tc clusters
  function drawLppl() {
    const wrap = document.getElementById("cad-lppl-wrap");
    wrap.innerHTML = "";
    const rows = [
      { key: "NDX", lk: "lppl_ndx_l", nk: "lppl_ndx_n" },
      { key: "NVDA", lk: "lppl_nvda_l", nk: "lppl_nvda_n" },
      { key: "TAIEX", lk: "lppl_taiex_l", nk: "lppl_taiex_n" },
    ];
    rows.forEach(r => {
      const counts = (DATA.lppls[r.key] || {}).counts || {};
      const months = Object.keys(counts).sort();
      const W = Math.max(wrap.clientWidth || 600, 320), H = 140, M = { t: 36, r: 12, b: 26, l: 12 };
      const div = document.createElement("div");
      div.style.cssText = "position:relative;";
      wrap.appendChild(div);
      const svg = d3.select(div).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", W).attr("height", H)
        .attr("role", "img").attr("aria-label", t(r.lk) + " 的 tc 月份分布");
      const total = d3.sum(months, m => counts[m]);
      const maxV = d3.max(months, m => counts[m]);
      const bw = (W - M.l - M.r) / Math.max(months.length, 1);
      const scale = d3.scaleLinear().domain([0, maxV]).range([H - M.b, M.t]);
      months.forEach((m, i) => {
        const v = counts[m];
        const bh = H - M.b - scale(v);
        const col = `var(--viz-series-${(i % 6) + 1})`;
        svg.append("rect").attr("x", M.l + i * bw + 3).attr("y", scale(v))
          .attr("width", Math.max(bw - 6, 8)).attr("height", Math.max(bh, 1)).attr("fill", col).attr("opacity", 0.85)
          .attr("data-tooltip", tf("tt_lppl", { l: t(r.lk), m: m, v: v, t: total }));
        svg.append("text").attr("x", M.l + i * bw + bw / 2).attr("y", scale(v) - 4)
          .attr("text-anchor", "middle").attr("font-size", 11).attr("fill", PAL.fg).text(v);
        svg.append("text").attr("x", M.l + i * bw + bw / 2).attr("y", H - M.b + 15)
          .attr("text-anchor", "middle").attr("font-size", 11).attr("fill", PAL.mut).text(m);
      });
      svg.append("text").attr("x", M.l).attr("y", 12).attr("font-size", 11).attr("fill", PAL.fg)
        .html(`${t(r.lk)}　<tspan fill="${PAL.mut}">${t(r.nk)}${tf("lppl_pass", { v: total, t: (DATA.lppls[r.key] || {}).windows })}</tspan>`);
    });
    // validation table
    const val = document.getElementById("cad-lppl-val");
    const rowsV = (DATA.lppl_validation || []).map(w =>
      `<tr><td class="text-nowrap">${w.end}</td><td class="text-nowrap tabular-nums">${w.tc || "—"}</td><td class="tabular-nums">${w.qual}</td></tr>`);
    val.innerHTML = `<table class="table table-sm"><thead><tr><th>${t("val_h_end")}</th><th>${t("val_h_tc")}</th><th>${t("val_h_n")}</th></tr></thead><tbody>${rowsV.join("")}</tbody></table>
      <p class="text-small text-muted">${t("val_note")}</p>`;
  }

  // ────────────────────────────── panel 4: scenarios (coherent posterior)
  function drawScen() {
    const wrap = document.getElementById("cad-scen-wrap");
    wrap.innerHTML = "";
    const SC = DATA.scenarios;
    const scen = SC ? SC.ndx.map((r, i) => ({
      key: r.key, lo: r.lo * 100, hi: r.hi * 100, m: r.m * 100, pt: r.pt * 100,
      name: t("scen_name_" + r.key),
      chart: t("scen_chart_" + r.key),
      short: t("scen_short_" + r.key),
      proto: t("proto_" + r.key),
    })) : [];

    const W = Math.max(wrap.clientWidth || 600, 320), rowH = 44, H = rowH * scen.length + 26;
    const labelW = Math.min(210, Math.max(130, W * 0.36));
    const M = { l: labelW, r: 62 };
    const x = d3.scaleLinear().domain([0, 70]).range([M.l, W - M.r]);
    const svg = d3.select(wrap).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", W).attr("height", H)
      .attr("role", "img").attr("aria-label", "NDX scenarios (Dirichlet posterior)");
    [0, 10, 20, 30, 40, 50, 60, 70].forEach(v => {
      svg.append("text").attr("x", x(v)).attr("y", 14).attr("text-anchor", "middle")
        .attr("font-size", 11).attr("fill", PAL.mut).text(v + "%");
    });
    scen.forEach((sc, i) => {
      const y = 28 + i * rowH;
      const col = `var(--viz-series-${i + 1})`;
      svg.append("text").attr("x", M.l - 8).attr("y", y + 14).attr("text-anchor", "end")
        .attr("font-size", 11).attr("fill", PAL.fg).text((W < 420 && sc.short) ? sc.short : sc.chart);
      // 80% interval bar
      svg.append("rect").attr("x", x(sc.lo)).attr("y", y + 6).attr("width", Math.max(x(sc.hi) - x(sc.lo), 2))
        .attr("height", 9).attr("fill", col).attr("opacity", 0.45)
        .attr("data-tooltip", tf("tt_scen_iv", { n: sc.name, lo: sc.lo.toFixed(1), hi: sc.hi.toFixed(1), p: sc.proto }));
      // median marker
      svg.append("rect").attr("x", x(sc.m) - 1.2).attr("y", y + 2).attr("width", 2.4)
        .attr("height", 17).attr("fill", col)
        .attr("data-tooltip", tf("tt_scen_med", { n: sc.name, m: sc.m.toFixed(1), pt: sc.pt.toFixed(1) }));
      svg.append("text").attr("x", x(sc.hi) + 6).attr("y", y + 14).attr("dy", "0.35em")
        .attr("font-size", 11).attr("fill", PAL.fg)
        .text(`${sc.pt.toFixed(1)}% [${sc.lo.toFixed(0)}–${sc.hi.toFixed(0)}]`);
    });
    if (SC) {
      const note = document.createElement("p");
      note.className = "text-small text-muted";
      note.textContent = tf("scen_note", { k: SC.k });
      wrap.appendChild(note);
    }

    const tb = document.getElementById("cad-scen-table");
    const ndx = SC ? SC.ndx : [];
    const tw = SC ? SC.taiex : [];
    tb.innerHTML = `<table class="table table-sm"><thead><tr><th>${t("th_scen")}</th><th>${t("th_ndx_pt")}</th><th>${t("th_ndx_iv")}</th></tr></thead><tbody>
      <tr><td>${t("scen_name_E1")}</td><td class="tabular-nums">${(ndx[0] || {}).pt != null ? ((ndx[0].pt * 100).toFixed(1) + "%") : "2.4%"}</td><td class="tabular-nums">0.1–6.3%</td></tr>
      <tr><td>${t("scen_name_E2")}</td><td class="tabular-nums">${(ndx[1] || {}).pt != null ? ((ndx[1].pt * 100).toFixed(1) + "%") : "50.0%"}</td><td class="tabular-nums">37.0–63.0%</td></tr>
      <tr><td>${t("scen_name_E3")}</td><td class="tabular-nums">${(ndx[2] || {}).pt != null ? ((ndx[2].pt * 100).toFixed(1) + "%") : "23.7%"}</td><td class="tabular-nums">13.3–35.2%</td></tr>
      <tr><td>${t("scen_name_E4")}</td><td class="tabular-nums">${(ndx[3] || {}).pt != null ? ((ndx[3].pt * 100).toFixed(1) + "%") : "23.9%"}</td><td class="tabular-nums">13.4–35.3%</td></tr>
      <tr><td>${t("taiex_e3")}</td><td class="tabular-nums">${(tw[2] || {}).pt != null ? ((tw[2].pt * 100).toFixed(1) + "%") : "59.6%"}</td><td class="tabular-nums">37.8–79.0%</td></tr>
      <tr><td>${t("taiex_e4")}</td><td class="tabular-nums">${(tw[3] || {}).pt != null ? ((tw[3].pt * 100).toFixed(1) + "%") : "40.4%"}</td><td class="tabular-nums">21.1–62.2%</td></tr>
      <tr><td>${t("taiex_p")}</td><td class="tabular-nums">97.3%</td><td class="tabular-nums">${t("taiex_p_iv")}</td></tr>
      <tr><td>${t("timing_label")}</td><td class="tabular-nums" colspan="2">${SC ? tf("timing_val", { a: Math.round(SC.timing["2026Q4"] * 100), b: Math.round(SC.timing["2027H1"] * 100), c: Math.round(SC.timing["2027H2+"] * 100) }) : "50% / 32.5% / 17.5%"}</td></tr>
      </tbody></table>
      <p class="text-small text-muted">${t("scen_sens")}</p>`;
  }

  // ────────────────────────────── wiring
  // fill KPI cards from DATA so the cards always agree with the charts
  const pct1 = (v) => (v < 0 ? "−" : "+") + Math.abs(v).toFixed(1) + "%";
  const byId = (id) => document.getElementById(id);
  function fillKPI() {
    if (DATA.cape_now != null) byId("cad-v-cape").textContent = DATA.cape_now.toFixed(2);
    if (DATA.cape_pct != null) byId("cad-c-cape").textContent = tf("kpi_cap_cape", { p: Math.round(DATA.cape_pct) });
    if (DATA.mv_gdp_now != null) byId("cad-v-mvgdp").textContent = DATA.mv_gdp_now.toFixed(2);
    if (DATA.ecy_now != null) byId("cad-v-ecy").textContent = (DATA.ecy_now < 0 ? "−" : "+") + Math.abs(DATA.ecy_now).toFixed(2) + "%";
    if (DATA.live && DATA.live.NDX) {
      byId("cad-v-dd").textContent = "NDX " + pct1(DATA.live.NDX.drawdown_pct);
      byId("cad-s-dd").textContent = ["TAIEX", "NVDA", "SPX"].map(k => k + " " + pct1(DATA.live[k].drawdown_pct)).join(" · ");
      byId("cad-info-dd").setAttribute("data-tooltip", tf("kpi4_tip", { n: pct1(DATA.live.NDX.drawdown_pct), t: pct1(DATA.live.TAIEX.drawdown_pct), v: pct1(DATA.live.NVDA.drawdown_pct), s: pct1(DATA.live.SPX.drawdown_pct) }));
    }
  }

  // generic data-tooltip handler (panels 2-4 marks + KPI info icons)
  const gt = document.createElement("div");
  gt.className = "tooltip"; gt.hidden = true; gt.style.position = "fixed";
  ROOT.appendChild(gt);
  ROOT.addEventListener("pointermove", (ev) => {
    const el = ev.target.closest("[data-tooltip]");
    if (!el) { gt.hidden = true; return; }
    gt.textContent = el.getAttribute("data-tooltip");
    gt.hidden = false;
    const pad = 12, r = gt.getBoundingClientRect();
    let tx = ev.clientX + pad, ty = ev.clientY + pad;
    if (tx + r.width > window.innerWidth - 8) tx = ev.clientX - r.width - pad;
    if (ty + r.height > window.innerHeight - 8) ty = ev.clientY - r.height - pad;
    gt.style.left = tx + "px"; gt.style.top = ty + "px";
  });
  ROOT.addEventListener("pointerleave", () => { gt.hidden = true; });

  // language pills
  ROOT.addEventListener("click", (ev) => {
    const b = ev.target.closest(".cad-lang");
    if (b) setLang(b.dataset.lang);
  });

  applyLang();
  buildLegend();
  fillKPI();
  drawPaths();
  drawCond();
  drawLppl();
  drawScen();

  const ro = new ResizeObserver(() => { drawPaths(); });
  ro.observe(pathsWrap);
  let lastW = 0;
  const ro2 = new ResizeObserver((es) => {
    const w = Math.round(es[0].contentRect.width);
    if (Math.abs(w - lastW) > 40) { lastW = w; drawCond(); drawLppl(); drawScen(); }
  });
  ro2.observe(ROOT);

  // redraw hidden panels when their tab becomes visible
  ROOT.querySelectorAll('[role="tab"]').forEach(tb2 => {
    tb2.addEventListener("click", () => {
      setTimeout(() => { drawCond(); drawLppl(); drawScen(); drawPaths(); }, 60);
    });
  });
})();
</script>

<footer data-i18n="doc_footer">以四層量化管線（資料 → 指標 → 類比 → 統計）產出 · 非投資建議</footer>
<script>
document.addEventListener("click", (ev) => {
  const btn = ev.target.closest('.nav-link[role="tab"]');
  if (!btn) return;
  document.querySelectorAll('.nav-link[role="tab"]').forEach(b => {
    b.classList.toggle("active", b === btn);
    b.setAttribute("aria-selected", b === btn ? "true" : "false");
  });
  document.querySelectorAll('[role="tabpanel"]').forEach(p => {
    p.hidden = p.id !== btn.getAttribute("aria-controls");
  });
});
</script>
