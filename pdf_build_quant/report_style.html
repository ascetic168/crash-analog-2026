<style>
@page {
  size: A4;
  margin: 20mm 18mm 20mm 18mm;
}
:root {
  --jf: "Microsoft JhengHei", "Microsoft JHengHei", sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 10.5pt; }
body {
  font-family: var(--jf);
  color: #151617;
  line-height: 1.72;
  margin: 0;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* ── headings ── */
h1, h2, h3 { font-weight: 700; line-height: 1.35; }
h1 {
  font-size: 18.5pt;
  margin: 0 0 6pt 0;
  padding-bottom: 6pt;
  border-bottom: 2.2pt solid rgba(162, 44, 64, 0.35);
}
h2 {
  font-size: 14pt;
  color: #4a6675;
  margin: 16pt 0 7pt 0;
}
h3 { font-size: 11.5pt; margin: 12pt 0 6pt 0; }

p { margin: 0 0 8pt 0; }
ul, ol { margin: 0 0 8pt 0; padding-left: 1.5em; }
li { margin-bottom: 4pt; }
strong { color: #151617; }
a { color: #578095; text-decoration: none; }
a.url-sm { font-size: 10.5pt; }
code {
  font-family: Consolas, monospace;
  font-size: 9pt;
  background: #eaeced;
  padding: 1pt 4pt;
  border-radius: 3pt;
  color: #4a6675;
}

/* ── tables ── */
table {
  width: 100%;
  border-collapse: collapse;
  margin: 8pt 0 4pt 0;
  font-size: 8.8pt;
  line-height: 1.45;
  table-layout: auto;
}
th {
  background: #4a6675;
  color: #ffffff;
  font-weight: 700;
  padding: 3.5pt 4pt;
  border: 0.5pt solid #c7d3d9;
  text-align: center;
  vertical-align: middle;
  overflow-wrap: anywhere;
}
td {
  padding: 3.5pt 4pt;
  border: 0.5pt solid #c7d3d9;
  vertical-align: top;
  overflow-wrap: anywhere;
}
tr:nth-child(even) td { background: #eaeced; }

/* ── images ── */
img { max-width: 100%; height: auto; margin: 6pt 0 2pt 0; }
figure { margin: 8pt 0 10pt 0; page-break-inside: avoid; break-inside: avoid; }
figcaption, .caption { color: #757c7f; font-size: 8.5pt; text-align: center; }

/* ── pandoc TOC page ── */
nav#TOC {
  page-break-after: always;
  break-after: page;
}
nav#TOC::before {
  content: "目錄";
  display: block;
  font-size: 18.5pt;
  font-weight: 700;
  padding-bottom: 6pt;
  margin-bottom: 10pt;
  border-bottom: 2.2pt solid rgba(162, 44, 64, 0.35);
}
nav#TOC ul { list-style: none; padding-left: 0; margin: 0; }
nav#TOC ul ul { padding-left: 1.6em; }
nav#TOC li { margin-bottom: 5pt; }
nav#TOC > ul > li { font-weight: 700; font-size: 11.5pt; margin-top: 7pt; }
nav#TOC ul ul li { font-weight: 400; font-size: 10pt; color: #4a6675; }
nav#TOC a { color: inherit; }
nav#TOC .tocpg {
  float: right;
  color: #757c7f;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
}

/* blockquote */
blockquote {
  margin: 8pt 0;
  padding: 6pt 12pt;
  border-left: 2.5pt solid #a22c40;
  background: #eaeced;
}

/* section page-break divs from the markdown source */
div[style*="break-after"], div[style*="page-break"] { }
</style>
